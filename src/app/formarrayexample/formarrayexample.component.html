<div class="container p-8">
  <div class="col-md-6">
    <form [formGroup]="myForm" (ngSubmit)="submitBiodata()">
      <h1><b>Personal Information</b></h1>
      <div formGroupName="personalInfo">
        <label>First Name:</label>
        <input class="form-control form-control-sm" type="text" formControlName="firstName" required>
        <label>Last Name:</label>
        <input class="form-control form-control-sm" type="text" formControlName="lastName" required>
        <label>Age:</label>
        <input class="form-control form-control-sm" type="number" formControlName="age" required> <!-- Change type to "text" if it's not an email input -->
        <label>Gender:</label>
        <input class="form-control form-control-sm" type="text" formControlName="gender">
  
        <h2>Dependants</h2>
        <div formGroupName="dependants">
          <label>First Name:</label>
          <input class="form-control form-control-sm" type="text" formControlName="firstName">
          <label>Last Name:</label>
          <input class="form-control form-control-sm" type="text" formControlName="lastName"> <!-- Corrected to "secondName" -->
          <label>Gender:</label>
          <input class="form-control form-control-sm" type="text" formControlName="gender">
        </div>
      </div>
  
      <br>
      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  </div>

  <div class="col-md-6">

  </div>


  </div>
