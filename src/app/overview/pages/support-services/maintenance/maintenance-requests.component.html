<div class="maintenance-requests-component-page" [class.dark]="isDarkMode">
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">
        <i class="bi bi-tools"></i>
        Maintenance Requests
      </h1>
      <p class="page-subtitle">Track and manage maintenance requests</p>
    </div>
    <div class="header-right">
      <button class="btn-primary" (click)="createNew()">
        <i class="bi bi-plus-circle"></i>
        New Maintenance
      </button>
      <button class="btn-secondary">
        <i class="bi bi-download"></i>
        Export
      </button>
    </div>
  </div>

  <div class="stats-grid">
    
    <div class="stat-card stat-pending">
      <div class="stat-icon"><i class="bi bi-clock-history"></i></div>
      <div class="stat-content">
        <div class="stat-value">{{pendingRequests}}</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>
    <div class="stat-card stat-in-progress">
      <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
      <div class="stat-content">
        <div class="stat-value">{{inProgressRequests}}</div>
        <div class="stat-label">In Progress</div>
      </div>
    </div>
  </div>

  <div class="filters-section">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search..." [(ngModel)]="searchQuery">
    </div>
    <div class="filter-group">
      <select class="filter-select" [(ngModel)]="statusFilter">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <input type="date" class="filter-select" [(ngModel)]="dateFilter">
    </div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <h3 class="table-title">Maintenance Requests</h3>
      <div class="table-actions">
        <button class="btn-sm btn-secondary">
          <i class="bi bi-funnel"></i>
          More Filters
        </button>
      </div>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredItems">
            <td><div class="item-id">{{item.id}}</div></td>
            <td><div class="item-name">{{item.name}}</div></td>
            <td>
              <span class="status-badge" [class]="'status-' + item.status">
                {{item.status | titlecase}}
              </span>
            </td>
            <td>{{item.date}}</td>
            <td>
              <div class="action-buttons">
                <button class="btn-icon" (click)="viewDetails(item)">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn-icon" (click)="editItem(item)">
                  <i class="bi bi-pencil"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button class="page-btn" [disabled]="currentPage === 1">
        <i class="bi bi-chevron-left"></i>
      </button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="page-btn" [disabled]="currentPage === totalPages">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
