<div class="patient-info-card" *ngIf="patient; else noPatient">
  <div class="patient-header">
    <div class="patient-avatar">
      <img [src]="patient.profilePic || 'assets/images/vector.jpeg'" 
           [alt]="patient.firstName + ' ' + patient.lastName"
           class="avatar-img">
    </div>
    <div class="patient-details">
      <h3 class="patient-name">
        {{ patient.firstName | uppercase }} {{ patient.lastName | uppercase }}
      </h3>
      <p class="patient-email" *ngIf="patient.email">{{ patient.email }}</p>
      <p class="patient-phone" *ngIf="patient.phone">{{ patient.phone }}</p>
      <p class="patient-group" *ngIf="patient.patientGroup">
        Group: {{ patient.patientGroup }}
      </p>
    </div>
  </div>
</div>

<ng-template #noPatient>
  <div class="no-patient-card">
    <div class="text-center">
      <i class="bi bi-person-plus" style="font-size: 3rem; color: #6c757d; margin-bottom: 1rem;"></i>
      <h4>No Patient Selected</h4>
      <p class="text-muted">Search and select a patient to start consultation</p>
      <div class="search-box">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search by name, ID, or phone..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="searchPatients()">
        <button class="btn btn-primary btn-sm mt-2" (click)="searchPatients()">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </div>
  </div>
</ng-template>

<div class="loading-overlay" *ngIf="isLoading">
  <div class="spinner-border text-primary" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
