<div class="patient-info-card" *ngIf="patient; else noPatient">
  <div class="patient-header">
    <div class="patient-avatar">
      <img [src]="patient.profilePic || 'assets/images/vector.jpeg'" 
           [alt]="patient.firstName + ' ' + patient.lastName"
           class="avatar-img">
    </div>
    <div class="patient-details">
      <h3 class="patient-name">
        {{ patient.firstName | uppercase }} {{ patient.lastName | uppercase }}
      </h3>
      <p class="patient-email">{{ patient.email }}</p>
      <p class="patient-phone">{{ patient.phone }}</p>
      <p class="patient-group" *ngIf="patient.patientGroup">
        Group: {{ patient.patientGroup }}
      </p>
    </div>
  </div>
  
  <div class="patient-actions">
    <button class="btn btn-primary btn-sm" (click)="onEditPatient(patient)">
      <i class="fas fa-edit"></i> Edit
    </button>
    <button class="btn btn-danger btn-sm" (click)="onDeletePatient(patient.id!)">
      <i class="fas fa-trash"></i> Delete
    </button>
  </div>
</div>

<ng-template #noPatient>
  <div class="no-patient-card">
    <div class="text-center">
      <i class="fas fa-user-plus fa-3x text-muted mb-3"></i>
      <h4>No Patient Selected</h4>
      <p class="text-muted">Please select a patient to view their information</p>
    </div>
  </div>
</ng-template>

<div class="loading-overlay" *ngIf="isLoading">
  <div class="spinner-border text-primary" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
