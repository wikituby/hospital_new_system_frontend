<section class="vh-100" style="background-color: #45907e;">
    <div class="container py-1 h-100" style="border-radius: 18px;">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-12">
                <div class="card" style="border-radius: 3rem;">
                    <div class="row g-0">

                        <div class="col-md-6 col-lg-5 d-none d-md-block">
                            <img src="assets/images/med3.jpg" alt="login form" class="img-fluid"
                                style="border-radius: 1rem 0 0 1rem;margin-left: 30px;margin-top: 50px;" />
                        </div>

                        <div class="col-md-6 col-lg-7 d-flex align-items-center">

                            <div class="card-body p-3 p-lg-5 text-black">


                                <form [formGroup]="loginForm" #usersForm="ngForm" (ngSubmit)="getUserFormData(usersForm.value)">

                                    <div class="d-flex align-items-center mb-3 pb-1">
                                        <i class="bi bi-lungs"
                                            style="font-size: 50px; margin-right: 12px;color: #479c87;"></i>
                                        <span class="h1 fw-bold mb-0" style="font-size:40px;">Veneranda<strong
                                                style="color: #39a58e;margin-right: 5px;">Medical</strong></span>
                                    </div>

                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;font-size: 20px;">Sign
                                        into your MedScore account</h5>

                                    <div class="form-group input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">
                                                <i class="bi bi-envelope-fill"
                                                    style="font-size:20px; color: #39a58e;"></i>
                                            </span>
                                        </div>
                                        <input formControlName="email" class="form-control form-control-lg" placeholder="Enter email" type="email" required email />
                                    </div>
                                    <h3 *ngIf="loginForm.controls['email'].dirty && loginForm.hasError('required','email')" class="text-danger">*email is required</h3>
                              
                                
                                    <div class="form-group input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">
                                                <i class="bi bi-person-fill-lock"
                                                    style="font-size:20px; color: #39a58e;"></i>
                                            </span>
                                        </div>
                                        <input formControlName="password" class="form-control form-control-lg" placeholder="Enter password"
                                            [type]="type" />
                                        <span class="input-group-text">
                                            <i class="{{eyeIcon}}" style="font-size:20px; color: #39a58e;"
                                                (click)="hideShowPassword()"></i>
                                        </span>
                                       
                                    </div>
                                    <h3 *ngIf="loginForm.controls['password'].dirty && loginForm.hasError('required','password')" class="text-danger">*password is required</h3>
                                    


                                    <div class="pt-1 mb-4">
                                        <button [disabled]="loginForm.invalid" class="btn btn-success btn-lg btn-block" type="submit"
                                            style="background-color: #479c87;border-radius: 24px;border-color: #479c87;">
                                            Login
                                        </button>
                                    </div>
                                    <h3 *ngIf="notFound" class="text-danger">Email or password incorrect, Please correct it and login again</h3>

                  
                                 






                                    <span style="color: #165047;">
                                        <a style="color: #39a58e;" [routerLink]="['/sendemail']">Forgot password?</a>
                                    </span>

                                    <span style="color: #165047;margin-left: 20px;">
                                        Don't have a MedCore account?
                                        <a style="color: #39a58e;" [routerLink]="['/signup']">Register here</a>
                                    </span><br><br>

                                    <!--<span style="color: #165047;">
                                        or <span class="finger" style="color: #39a58e;" (click)="noLogin()">Continue
                                            without Login</span>
                                    </span>-->

                                                      
                                    <div class="row">
                                        <div class="col">
                                            <br>
                                            <a target="_blank" class="text-decoration-none">
                                                <img src="assets/images/new.png" alt="login form" class="img-fluid"
                                                style="width: 40px;height: 40px;margin-right: 15px;" />
                                            </a>
                                            <a  target="_blank" class="text-decoration-none">
                                                <img src="assets/images/facebook.png" alt="login form" class="img-fluid"
                                                style="width: 36px;height: 36px; margin-right: 15px;" />
                                            </a>
                                            <a  target="_blank" class="text-decoration-none">
                                                <img src="assets/images/instagram.png" alt="login form" class="img-fluid"
                                                style="width: 36px;height: 36px; margin-right: 15px;" />
                                            </a>
                                            <a  target="_blank" class="text-decoration-none">
                                                <img src="assets/images/linkedin.png" alt="login form" class="img-fluid"
                                                style="width: 36px;height: 36px; margin-right: 15px;" />                                                </a>
                                       </div>
                                    </div>
                                    <br>

                                    <a class="small text-muted">Terms of use.</a>
                                    <a class="small text-muted">Privacy policy</a>
                                </form>


                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
