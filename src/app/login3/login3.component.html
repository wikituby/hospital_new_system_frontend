<section class="vh-100" style="background-image: url('assets/images/surgery.jpg');background-size: cover;">
    <div class="container py-1 h-100 w-lg-50%" style="border-radius: 2px; width: 52%; ">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-12">
                <div class="card d-flex justify-content-center align-items-center"
                    style="border-radius: 3rem; background-color: rgba(255, 255, 255, 0.95);">
                    <div class="row g-0 d-flex justify-content-center align-items-center">


                        <div class="col-md-12 col-lg-12 d-flex justify-content-center align-items-center">

                            <div
                                class="card-body pl-5 pr-5 p-lg-6 pt-5 pb-5 text-black d-flex justify-content-center align-items-center">


                                <form [formGroup]="loginForm" #usersForm="ngForm"
                                    (ngSubmit)="getUserFormData(usersForm.value)">

                                    <div class="d-flex justify-content-center align-items-center p-10">
                                        <div class="d-flex align-items-center ">
                                            <!--<i class="bi bi-lungs"
                                                style="font-size: 60px;font-weight: bolder; margin-right: 12px;color: rgb(34, 92, 201);"></i>-->
                                            <span class="h1 fw-bold mb-0" style="font-size:35px;color: #4977d1;letter-spacing: 5px;">
                                                <!--<i class="bi bi-lungs" style="font-size: 40px; margin-right: 3px;color: #479c87;"></i>-->
                                            <strong style="color: rgb(34, 92, 201);">Veneranda</strong> Medical</span>
                                        
                                            </div>
                                    </div>
                                    <div class="d-flex justify-content-center align-items-center">

                                        <h5 class="fw-normal mb-5 pt-0 d-flex align-items-center"
                                            style="letter-spacing: 1px;font-size: 15px;color: #444a49;">Sign in
                                            into your Medical account</h5>
                                    </div>

                                    <div class="form-group input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">
                                                <i class="bi bi-envelope-fill"
                                                    style="font-size:17px; color: rgb(34, 92, 201);"></i>
                                            </span>
                                        </div>
                                        <input formControlName="email" class="form-control form-control-lg"
                                            placeholder="Enter email" type="email" required email />
                                    </div>
                                    <h3 *ngIf="loginForm.controls['email'].dirty && loginForm.hasError('required','email')"
                                        class="text-danger">*email is required</h3>


                                    <div class="form-group input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">
                                                <i class="bi bi-person-fill-lock"
                                                    style="font-size:17px; color: rgb(34, 92, 201);"></i>
                                            </span>
                                        </div>
                                        <input formControlName="password" class="form-control form-control-lg"
                                            placeholder="Enter password" [type]="type" />
                                        <span class="input-group-text">
                                            <i class="{{eyeIcon}}" style="font-size:17px; color: #375bbd;"
                                                (click)="hideShowPassword()"></i>
                                        </span>

                                    </div>
                                    <h3 *ngIf="loginForm.controls['password'].dirty && loginForm.hasError('required','password')"
                                        class="text-danger">*password is required</h3>

                                    <div class="pt-1 mb-4">
                                        <button [disabled]="loginForm.invalid" class="btn btn-success btn-lg btn-block"
                                            type="submit"
                                            style="background-color: #2164cf;border-radius: 20px;border-color: #2164cf;">
                                            Login
                                        </button>
                                    </div>
                                    <h3 *ngIf="notFound" class="text-danger">Email or password incorrect, Please correct
                                        it and login again</h3>


                                    <div class="d-flex justify-content-center align-items-center">
                                        <span style="color: #162950;">
                                            <a style="color: #3057c2;" [routerLink]="['/sendemail']">Forgot
                                                password?</a>
                                        </span>

                                        <span style="margin-left: 20px;">
                                            Don't have account?
                                            <a style="color: #3057c2;" [routerLink]="['/signup']">Register here</a>
                                        </span><br>

                                        <!-- <span style="color: #165047;">
                                        or <span class="finger" style="color: #39a58e;" (click)="noLogin()">Continue
                                            without Login</span>
                                    </span>-->
                                    </div>


                                    <div class="d-flex justify-content-center align-items-center">
                                        <span style="color: rgb(79, 79, 112);margin-top: 8px;">
                                            <u>or sign in with one of the following below</u>
                                        </span>


                                        <!-- 
                                    <span style="margin-left: 20px;">
                                        Don't have account?
                                        <a style="color: #39a58e;" [routerLink]="['/signup']">Register here</a>
                                    </span><br>

                                   <span style="color: #165047;">
                                        or <span class="finger" style="color: #39a58e;" (click)="noLogin()">Continue
                                            without Login</span>
                                    </span>-->
                                    </div>



                                    <div class="row d-flex justify-content-center align-items-center">
                                        <div class="d-flex justify-content-center align-items-center">
                                            <div><br>
                                                <a target="_blank" class="text-decoration-none">
                                                    <img src="assets/images/new.png" alt="login form" class="img-fluid"
                                                        style="width: 30px;height: 30px;;margin-right: 15px;" />
                                                </a>
                                                <a target="_blank" class="text-decoration-none">
                                                    <img src="assets/images/facebook.png" alt="login form"
                                                        class="img-fluid"
                                                        style="width: 30px;height: 30px; margin-right: 15px;" />
                                                </a>
                                                <a target="_blank" class="text-decoration-none">
                                                    <img src="assets/images/instagram.png" alt="login form"
                                                        class="img-fluid"
                                                        style="width: 30px;height: 30px; margin-right: 15px;" />
                                                </a>
                                                <a target="_blank" class="text-decoration-none">
                                                    <img src="assets/images/linkedin.png" alt="login form"
                                                        class="img-fluid" style="width: 30px;height: 30px;" /> </a>
                                            </div>

                                        </div>
                                    </div>


                                    <div class="d-flex justify-content-center align-items-center mt-3">
                                        <a class="small text-muted" style="font-size: 13px;">Terms of use. Privacy policy</a>
                                        <!--<a class="small text-muted" style="font-size: 13px;">Privacy policy</a>-->
                                    </div>
                                </form>


                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
